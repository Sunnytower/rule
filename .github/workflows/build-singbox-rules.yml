name: Build sing-box rules

on:
  push:
    paths:
      - "surge/**"
      - "tools/surge_to_singbox.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Convert rules
        run: python tools/surge_to_singbox.py

      - name: Commit generated rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sing-box/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "build: update sing-box rules [skip ci]"
          git push