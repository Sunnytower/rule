# 规则组名称同时决定输出路径：
#   surge/<name>.list
#   sing-box/<name>.json
#   mihomo/<name>.list（classical text rule-provider）
# Mihomo 优先使用上游原生规则；format: mihomo 支持 Mihomo/Clash classical text 和裸 CIDR text。
# 仅无原生源时才将 Surge 源加入 mihomo target；转换会省略 USER-AGENT 和 URL-REGEX，
# 其他未知类型会中止构建。
# 原生源下载或解析失败同样会中止，不会静默回退到转换源。
#
# 可在任意规则组下增加少量本地规则：
# targets 可省略，默认应用到该规则组的全部输出。
# value 与 values 二选一；values 中的每个值共用同一组 type、targets 和 options。
#   custom:
#     add:
#       - type: domain_suffix
#         values: [test.com, example.com]
#         targets: [surge, sing-box, mihomo]
#     remove:
#       - type: domain
#         value: obsolete.example.com
#         targets: [surge, sing-box, mihomo]

rulesets:
  ai:
    sources:
      - url: https://ruleset.skk.moe/List/non_ip/ai.conf
        format: surge
        targets: [surge]
